services:
  api:
    build: ./api
    image: us-west1-docker.pkg.dev/${PROJECT_ID}/tracker/api:latest
    restart: unless-stopped
    environment:
      - CHECKIN_PASSWORD=${CHECKIN_PASSWORD:-changeme}
      - PORT=3000
    volumes:
      - api-data:/app/data
    networks:
      - tracker

  frontend:
    build: ./frontend
    image: us-west1-docker.pkg.dev/${PROJECT_ID}/tracker/frontend:latest
    restart: unless-stopped
    networks:
      - tracker

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - tracker

volumes:
  api-data:

networks:
  tracker:
