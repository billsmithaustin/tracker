events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Rate-limit API writes (POST/PUT/DELETE) to 10 req/min per IP.
    # GET requests use an empty key, which nginx skips entirely.
    map $request_method $api_write_key {
        GET     "";
        default $binary_remote_addr;
    }
    limit_req_zone $api_write_key zone=api_write:1m rate=10r/m;
    limit_req_status 429;

    upstream frontend {
        server frontend:80;
    }

    upstream api {
        server api:3000;
    }

    # Redirect HTTP → HTTPS, but serve ACME challenges for cert renewal
    server {
        listen 80;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name biketriptracker.com;
        client_max_body_size 15m;

        ssl_certificate     /etc/letsencrypt/live/biketriptracker.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/biketriptracker.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.basemaps.cartocdn.com; connect-src 'self' https://api.open-meteo.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ {
            limit_req zone=api_write burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
