events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    map $request_method $api_write_key {
        GET     "";
        default $binary_remote_addr;
    }
    limit_req_zone $api_write_key zone=api_write:1m rate=10r/m;
    limit_req_status 429;

    upstream frontend {
        server frontend:80;
    }

    upstream api {
        server api:3000;
    }

    server {
        listen 80;
        client_max_body_size 15m;

        # Security headers (HSTS omitted — HTTP only in dev)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.basemaps.cartocdn.com https://unpkg.com; connect-src 'self' https://api.open-meteo.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;

        # Public dashboard and check-in UI
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # API
        location /api/ {
            limit_req zone=api_write burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
