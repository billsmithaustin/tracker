<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Log — TransAmerica Trail</title>
  <link rel="stylesheet" href="/css/main.css?v=1776016488">
</head>
<body>
<div id="app" style="grid-template-rows: auto 1fr auto;">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header>
    <div class="header-left">
      <div class="logo-badge">🚴</div>
      <div class="header-title">
        <h1>TransAmerica Trail</h1>
        <div class="subtitle">Yorktown, VA → Astoria, OR · 4,205 miles</div>
      </div>
    </div>
    <div class="header-right" style="display:flex;align-items:center;gap:0.75rem;">
      <button id="admin-btn" class="log-more-btn" onclick="toggleAdmin()" style="white-space:nowrap;">Admin</button>
      <a href="/" class="log-more-btn" style="white-space:nowrap;">← Back to Tracker</a>
    </div>
  </header>

  <!-- ── Log ────────────────────────────────────────────────────────────── -->
  <div id="log-wrap">
    <div class="section-title">All Check-ins</div>

    <div class="pagination" id="pagination-top">
      <button class="page-btn" id="prev-top" disabled>← Prev</button>
      <span class="page-info" id="page-info-top">—</span>
      <button class="page-btn" id="next-top">Next →</button>
    </div>

    <div id="log-entries">
      <p class="log-empty">Loading…</p>
    </div>

    <div class="pagination" id="pagination-bottom">
      <button class="page-btn" id="prev-bottom" disabled>← Prev</button>
      <span class="page-info" id="page-info-bottom">—</span>
      <button class="page-btn" id="next-bottom">Next →</button>
    </div>
  </div>

  <!-- ── Footer ─────────────────────────────────────────────────────────── -->
  <footer>
    <span>TransAmerica Trail · Yorktown, VA → Astoria, OR · 4,205 miles</span>
    <span id="last-updated">—</span>
    <span><a href="/checkin.html" style="color:var(--text-dim);text-decoration:none">Check In →</a></span>
  </footer>

</div>

<script src="/js/helpers.js?v=1776005369"></script>
<script>
const API = '/api';
const PER_PAGE = 20;
let allCheckins = [];
let currentPage = 1;
let adminPassword = sessionStorage.getItem('adminPassword') || null;

function toggleAdmin() {
  if (adminPassword) {
    // Lock: clear password and re-render
    adminPassword = null;
    sessionStorage.removeItem('adminPassword');
    updateAdminBtn();
    renderPage(currentPage);
    return;
  }
  const pw = prompt('Enter check-in password to enable admin mode:');
  if (!pw) return;
  adminPassword = pw;
  sessionStorage.setItem('adminPassword', pw);
  updateAdminBtn();
  renderPage(currentPage);
}

function updateAdminBtn() {
  const btn = document.getElementById('admin-btn');
  if (adminPassword) {
    btn.textContent = 'Admin: ON';
    btn.style.color = 'var(--accent)';
    btn.style.borderColor = 'var(--accent)';
  } else {
    btn.textContent = 'Admin';
    btn.style.color = '';
    btn.style.borderColor = '';
  }
}

async function deleteCheckin(id) {
  const c = allCheckins.find(x => x.id === id);
  const location = c ? (c.town || c.state ? `${c.name ? c.name + ' · ' : ''}${c.town || ''}${c.state ? ', ' + c.state : ''}` : (c.name || '—')) : '—';
  if (!confirm(`Delete check-in: "${location}"?\n\nThis cannot be undone.`)) return;
  try {
    const res = await fetch(`${API}/checkins/${id}`, {
      method: 'DELETE',
      headers: { 'X-Checkin-Password': adminPassword },
    });
    if (res.status === 401) {
      alert('Wrong password — admin mode disabled.');
      adminPassword = null;
      sessionStorage.removeItem('adminPassword');
      updateAdminBtn();
      renderPage(currentPage);
      return;
    }
    if (!res.ok) throw new Error(`API ${res.status}`);
    allCheckins = allCheckins.filter(c => c.id !== id);
    // Stay on current page unless it no longer exists
    const totalPages = Math.max(1, Math.ceil(allCheckins.length / PER_PAGE));
    renderPage(Math.min(currentPage, totalPages));
  } catch (e) {
    alert(`Delete failed: ${e.message}`);
  }
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderPage(page) {
  currentPage = page;
  const totalPages = Math.max(1, Math.ceil(allCheckins.length / PER_PAGE));
  const start = (page - 1) * PER_PAGE;
  const slice = allCheckins.slice(start, start + PER_PAGE);

  const wrap = document.getElementById('log-entries');

  if (!slice.length) {
    wrap.innerHTML = '<p class="log-empty">No check-ins yet. Trip hasn\'t started!</p>';
  } else {
    wrap.innerHTML = slice.map(c => {
      const deleteBtn = adminPassword
        ? `<button class="log-delete-btn" onclick="deleteCheckin(${c.id})" title="Delete check-in">×</button>`
        : '';
      return renderLogEntry(c, deleteBtn);
    }).join('');
  }

  const pageInfo = `Page ${page} of ${totalPages} · ${allCheckins.length} check-in${allCheckins.length !== 1 ? 's' : ''}`;
  document.getElementById('page-info-top').textContent    = pageInfo;
  document.getElementById('page-info-bottom').textContent = pageInfo;

  document.getElementById('prev-top').disabled    = page <= 1;
  document.getElementById('prev-bottom').disabled = page <= 1;
  document.getElementById('next-top').disabled    = page >= totalPages;
  document.getElementById('next-bottom').disabled = page >= totalPages;

  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString();

  // Scroll to top of log on page change (but not on initial load)
  if (page !== 1 || allCheckins.length > 0) {
    document.getElementById('log-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function goTo(delta) {
  const totalPages = Math.ceil(allCheckins.length / PER_PAGE);
  const next = Math.max(1, Math.min(totalPages, currentPage + delta));
  if (next !== currentPage) renderPage(next);
}

// ── Wire up pagination buttons ────────────────────────────────────────────────

['prev-top', 'prev-bottom'].forEach(id =>
  document.getElementById(id).addEventListener('click', () => goTo(-1)));
['next-top', 'next-bottom'].forEach(id =>
  document.getElementById(id).addEventListener('click', () => goTo(+1)));

// ── Fetch ─────────────────────────────────────────────────────────────────────

async function load() {
  try {
    const res = await fetch(`${API}/checkins`);
    if (!res.ok) throw new Error(`API ${res.status}`);
    allCheckins = await res.json(); // already newest-first from the API
    renderPage(1);
  } catch (e) {
    document.getElementById('log-entries').innerHTML =
      `<p class="log-empty">Could not load check-ins: ${escHtml(e.message)}</p>`;
    console.error(e);
  }
}

load();
updateAdminBtn();
</script>
</body>
</html>
